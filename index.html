async function login(){let e=document.getElementById('email').value.trim().toLowerCase(),p=document.getElementById('password').value,err=document.getElementById('loginerr');err.textContent='';if(!e||!p){err.textContent='Enter your email and password.';return}const {data,error}=await supabaseClient.auth.signInWithPassword({email:e,password:p});if(error){err.textContent=error.message;return}let role=e==='ahmedmazhar296@gmail.com'?'Super Admin':'Billing User';try{const {data:profile}=await supabaseClient.from('profiles').select('role,full_name').eq('id',data.user.id).maybeSingle();if(profile?.role)role=['super_admin','Super Admin','admin'].includes(profile.role)?'Super Admin':'Billing User'}catch(e){}showAppForUser(e,role)}

function renderNav(){let admin=current.role==='Super Admin';let items=[['Overview','▦'],['POS','＋'],['Products','▣'],['Categories','▤'],['Invoices','▤'],['Inventory','▥'],['Customers','♙'],['Reports','◷'],['Staff Accounts','♟'],['Roles & Permissions','⚙']];if(!admin)items=items.filter(x=>['Overview','POS','Invoices','Inventory','Customers','Reports'].includes(x[0]));document.getElementById('nav').innerHTML=items.map(([n,i])=>`<button class="${page===n?'active':''}" onclick="go('${n}')"><span>${i}</span>${n}</button>`).join('')}
function go(p){page=p;document.getElementById('crumb').textContent=p;renderNav();let c=document.getElementById('content');({Overview:overview,POS:pos,Products:productsPage,Categories:categoriesPage,Invoices:invoicesPage,Inventory:inventoryPage,Customers:customersPage,Reports:reportsPage,'Staff Accounts':staffPage,'Roles & Permissions':rolesPage}[p]||overview)(c)}

c.innerHTML=head('POS ✳','Create a bill, collect payment and update stock.')+`<div class="card poscheckout"><h2 class="sectiontitle">Billing / Checkout</h2><div class="notice">GSTIN status: <b>Pending</b>. Add your GSTIN later in Settings when registration is approved. Do not issue a GST tax invoice until registered and legally eligible.</div><div class="grid layout2"><div><label>Customer name</label><input id="billname" placeholder="Walk-in customer"><label style="margin-top:10px">Mobile number</label><input id="billmobile" placeholder="10-digit mobile number"></div><div><label>Bill notes</label><textarea id="billnotes" rows="2" placeholder="Delivery instructions or notes"></textarea></div></div><div style="margin-top:15px"><label>Items in current bill</label>${cart.length?cart.map((x,i)=>`<div class="billrow"><div><b>${esc(x.name)}</b><div class="small muted">${money(x.price)} each</div></div><input type="number" min="1" max="${x.stock}" value="${x.qty}" onchange="setQty(${x.id},this.value)"><b>${money(x.price*x.qty)}</b><button class="danger" onclick="removeCart(${x.id})">×</button></div>`).join(''):'<div class="empty">Your bill is empty. Add a demo product below.</div>'}</div><div class="grid layout2" style="margin-top:14px"><div><label>Tax on this bill</label><div class="tabs"><button class="${gstMode==='with'?'':'secondary'}" onclick="gstMode='with';go('POS')">With GST</button><button class="${gstMode==='without'?'':'secondary'}" onclick="gstMode='without';go('POS')">Without GST</button></div><div class="notice">${gstMode==='with'?'GST calculation preview only. GSTIN is pending; this mode must remain disabled for actual tax invoicing until registration/eligibility is confirmed.':'Non-GST receipt preview. Use only where legally permitted; GSTIN display does not make a non-GST supply valid.'}</div><label>Payment mode</label><select id="paymode" onchange="payMode=this.value"><option>Cash</option><option>UPI</option><option>Card</option></select><label style="margin-top:10px">Amount received</label><input id="received" type="number" min="0" step=".01" value="${total.toFixed(2)}"></div><div class="card" style="background:#faf9fc"><div class="billrow"><span>Subtotal</span><b>${money(subtotal)}</b></div><div class="billrow"><span>GST ${gstMode==='with'?'(preview)':'(not charged)'}</span><b>${money(tax)}</b></div><div class="billrow"><b>Total payable</b><b style="font-size:21px">${money(total)}</b></div><div class="billrow"><span>Balance due</span><b id="due">${money(Math.max(0,total-total))}</b></div><button style="width:100%;margin-top:10px" ${cart.length?'':'disabled'} onclick="completeSale()">Complete sale</button></div></div></div></div><h2 class="sectiontitle" style="margin:18px 0 10px">Find Products</h2><div class="toolbar"><input placeholder="Search products or scan a barcode..." oninput="window.prodSearch=this.value;pos(document.getElementById('content'))"><span class="small muted">Demo catalogue · ${products.length} products</span></div><div class="tabs"><button class="secondary ${categoryFilter==='All Items'?'active':''}" onclick="categoryFilter='All Items';go('POS')">All Items</button>${categories.map(x=>`<button class="secondary ${categoryFilter===x?'active':''}" onclick="categoryFilter='${esc(x)}';go('POS')">${esc(x)}</button>`).join('')}</div><div class="grid posproducts">${filtered.map(p=>`<div class="product"><div class="thumb">${p.category[0]}</div><span class="pill demo">DEMO</span><h3>${esc(p.name)}</h3><div class="small muted">${esc(p.category)} · ${esc(p.size)} · ${esc(p.color)}</div><div class="price">${money(p.sell)}</div><div class="small muted">${p.stock} in stock</div><button style="width:100%;margin-top:9px" ${p.stock<1?'disabled':''} onclick="addCart(${p.id})">Add to bill</button></div>`).join('')}</div>`}
function addCart(id){let p=products.find(x=>x.id===id);if(!p||p.stock<1)return;let x=cart.find(x=>x.id===id);if(x){if(x.qty<p.stock)x.qty++}else cart.push({id:p.id,name:p.name,price:p.sell,gst:p.gst,qty:1,stock:p.stock});go('POS')}
function setQty(id,v){let x=cart.find(x=>x.id===id);if(x)x.qty=Math.max(1,Math.min(Number(v)||1,x.stock));go('POS')}function removeCart(id){cart=cart.filter(x=>x.id!==id);go('POS')}
function completeSale(){let subtotal=cart.reduce((s,x)=>s+x.price*x.qty,0),tax=gstMode==='with'?cart.reduce((s,x)=>s+x.price*x.qty*x.gst/100,0):0,total=subtotal+tax,received=Number(document.getElementById('received').value||0);if(received<total){alert('Amount received is less than total.');return}if(gstMode==='with'){alert('GSTIN is pending. GST tax invoice mode is a preview only. Add GSTIN and confirm registration/eligibility before issuing a GST invoice.');return}if(!confirm('Create a non-GST receipt? Confirm this transaction is legally eligible for non-GST billing.'))return;let inv={no:'EAG-'+String(Date.now()).slice(-8),date:new Date().toISOString(),customer:document.getElementById('billname').value||'Walk-in customer',mobile:document.getElementById('billmobile').value,items:cart.map(x=>({...x})),subtotal,tax:0,total,received,payment:document.getElementById('paymode').value,status:received>=total?'Paid':'Due',mode:'Without GST',demo:true};invoices.push(inv);cart.forEach(x=>{let p=products.find(p=>p.id===x.id);if(p)p.stock-=x.qty});saveAll();cart=[];alert('Demo receipt created: '+inv.no);go('Invoices')}

function addProduct(){let val=id=>document.getElementById('p_'+id).value;let p={id:Date.now(),name:val('name'),sku:val('sku')||'SKU-'+Date.now(),brand:val('brand'),size:val('size'),color:val('color'),purchase:+val('purchase'),mrp:+val('mrp'),sell:+val('sell'),gst:+val('gst'),stock:+val('stock'),category:document.getElementById('p_category').value,demo:false};if(!p.name||!p.sell){alert('Enter product name and selling price.');return}products.push(p);saveAll();go('Products')}
function deleteProduct(id){if(confirm('Delete this product?')){products=products.filter(p=>p.id!==id);saveAll();go('Products')}}
function categoriesPage(c){c.innerHTML=head('Categories','Organize products by category.')+`<div class="card"><h2 class="sectiontitle">Add a category</h2><div class="toolbar"><input id="newcat" placeholder="Category name"><button onclick="addCategory()">Add category</button></div><h2 class="sectiontitle">All categories</h2><div class="tablewrap"><table><thead><tr><th>Category</th><th>Products</th><th>Action</th></tr></thead><tbody>${categories.map(x=>`<tr><td>${esc(x)}</td><td>${products.filter(p=>p.category===x).length}</td><td><button class="danger" onclick="deleteCategory('${esc(x)}')">Delete</button></td></tr>`).join('')}</tbody></table></div></div>`}
function addCategory(){let x=document.getElementById('newcat').value.trim();if(x&&!categories.includes(x)){categories.push(x);saveAll();go('Categories')}}
function deleteCategory(x){if(products.some(p=>p.category===x)){alert('Move or delete products in this category first.');return}categories=categories.filter(c=>c!==x);saveAll();go('Categories')}
function invoiceTable(arr){return arr.length?`<div class="tablewrap"><table><thead><tr><th>Invoice</th><th>Customer</th><th>Date</th><th>Tax mode</th><th>Payment</th><th>Total</th><th>Status</th><th></th></tr></thead><tbody>${arr.map(i=>`<tr><td>${i.no}</td><td>${esc(i.customer)}</td><td>${new Date(i.date).toLocaleDateString('en-IN')}</td><td>${i.mode}</td><td>${i.payment}</td><td>${money(i.total)}</td><td>${i.status}</td><td><button class="secondary" onclick="printInvoice('${i.no}')">Print</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No bills yet. Your first sale is waiting.</div>'}
function invoicesPage(c){c.innerHTML=head('Invoices','Find a bill, check payment status or print a copy.')+`<div class="card"><div class="toolbar"><input id="invsearch" placeholder="Search invoice, customer or mobile..." oninput="filterInvoices()"><button onclick="go('POS')">＋ New bill</button></div><div id="invtable">${invoiceTable(invoices.slice().reverse())}</div></div>`}
function filterInvoices(){let q=document.getElementById('invsearch').value.toLowerCase();document.getElementById('invtable').innerHTML=invoiceTable(invoices.filter(i=>(i.no+i.customer+i.mobile).toLowerCase().includes(q)).reverse())}
function printInvoice(no){let i=invoices.find(x=>x.no===no);if(!i)return;let w=window.open('','_blank');w.document.write(`<html><head><title>${i.no}</title><style>body{font:14px Arial;padding:30px}table{width:100%;border-collapse:collapse}td,th{padding:8px;border-bottom:1px solid #ddd;text-align:left}</style></head><body><h1>EAGLE COLLECTIONS</h1><p>${i.mode} receipt · GSTIN: Pending / Not configured</p><p>Invoice: ${i.no}<br>Date: ${new Date(i.date).toLocaleString()}<br>Customer: ${esc(i.customer)}<br>Mobile: ${esc(i.mobile)}</p><table><tr><th>Item</th><th>Qty</th><th>Price</th><th>Total</th></tr>${i.items.map(x=>`<tr><td>${esc(x.name)}</td><td>${x.qty}</td><td>${money(x.price)}</td><td>${money(x.price*x.qty)}</td></tr>`).join('')}</table><h3>Subtotal: ${money(i.subtotal)}</h3><h2>Total: ${money(i.total)}</h2><p>Payment: ${i.payment} · ${i.status}</p><p>Thank you!</p><script>window.print()<\/script></body></html>`);w.document.close()}
function inventoryPage(c){c.innerHTML=head('Inventory','Search products, review stock levels and manage inventory adjustments.')+`<div class="toolbar"><input id="stocksearch" placeholder="Search product, category or barcode..." oninput="filterStock()"><select id="stockfilter" onchange="filterStock()"><option>All stock</option><option>Low stock</option><option>Out of stock</option></select></div><div class="card tablewrap" id="stocktable">${stockTable(products)}</div>`}
function stockTable(arr){return `<table><thead><tr><th>Product</th><th>Category</th><th>SKU</th><th>Price</th><th>Stock</th><th>Status</th><th>Adjust</th></tr></thead><tbody>${arr.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.category)}</td><td>${esc(p.sku)}</td><td>${money(p.sell)}</td><td>${p.stock}</td><td>${p.stock===0?'<span style="color:var(--red)">Out of stock</span>':p.stock<=2?'<span style="color:#a06b18">Low stock</span>':'<span class="success">In stock</span>'}</td><td><button class="secondary" onclick="adjustStock(${p.id})">Adjust</button></td></tr>`).join('')}</tbody></table>`}
function filterStock(){let q=document.getElementById('stocksearch').value.toLowerCase(),f=document.getElementById('stockfilter').value;document.getElementById('stocktable').innerHTML=stockTable(products.filter(p=>(p.name+p.category+p.sku).toLowerCase().includes(q)&&(f==='All stock'||(f==='Low stock'?p.stock>0&&p.stock<=2:p.stock===0))))}
function adjustStock(id){let p=products.find(p=>p.id===id),v=prompt('Enter new stock quantity for '+p.name,p.stock);if(v!==null&&Number(v)>=0){p.stock=Number(v);saveAll();go('Inventory')}}
function customersPage(c){c.innerHTML=head('Customers','Purchase history and customer details in one place.')+`<div class="card"><h2 class="sectiontitle">Add a customer profile</h2><div class="formgrid"><div><label>Name</label><input id="cname"></div><div><label>Mobile</label><input id="cmobile"></div><div><label>Email</label><input id="cemail"></div><div><label>Address</label><input id="caddress"></div></div><button style="margin-top:12px" onclick="addCustomer()">Save customer</button></div><div class="card" style="margin-top:15px"><div class="toolbar"><input id="csearch" placeholder="Search name or mobile..." oninput="filterCustomers()"></div><div id="ctable">${customerTable(customers)}</div></div>`}
function addCustomer(){let n=document.getElementById('cname').value.trim(),m=document.getElementById('cmobile').value.trim();if(!n){alert('Enter customer name.');return}customers.push({name:n,mobile:m,email:document.getElementById('cemail').value,address:document.getElementById('caddress').value});saveAll();go('Customers')}
function customerTable(a){return a.length?`<table><thead><tr><th>Customer</th><th>Mobile</th><th>Bills</th><th>Total purchases</th></tr></thead><tbody>${a.map(x=>{let bills=invoices.filter(i=>i.mobile===x.mobile);return `<tr><td>${esc(x.name)}</td><td>${esc(x.mobile)}</td><td>${bills.length}</td><td>${money(bills.reduce((s,i)=>s+i.total,0))}</td></tr>`}).join('')}</tbody></table>`:'<div class="empty">No customers yet.</div>'}
function filterCustomers(){let q=document.getElementById('csearch').value.toLowerCase();document.getElementById('ctable').innerHTML=customerTable(customers.filter(x=>(x.name+x.mobile).toLowerCase().includes(q)))}
function reportsPage(c){let total=invoices.reduce((s,i)=>s+i.total,0),tax=invoices.reduce((s,i)=>s+i.tax,0),paid=invoices.reduce((s,i)=>s+i.received,0);c.innerHTML=head('Reports','Sales and tax summary for your store.')+stats([['TOTAL SALES',money(total)],['AMOUNT COLLECTED',money(paid)],['GST COLLECTED',money(tax)],['LOW STOCK ITEMS',products.filter(p=>p.stock<=2).length]])+`<div class="card" style="margin-top:16px"><h2 class="sectiontitle">Sales in this period</h2><div class="toolbar"><select><option>All time</option><option>Today</option><option>This week</option><option>This month</option></select><button class="secondary" onclick="downloadCSV()">Export CSV</button></div>${invoiceTable(invoices.slice().reverse())}</div>`}
function downloadCSV(){let rows=[['Invoice','Customer','Date','Mode','Payment','Total'],...invoices.map(i=>[i.no,i.customer,i.date,i.mode,i.payment,i.total])];let csv=rows.map(r=>r.map(x=>'"'+String(x??'').replaceAll('"','""')+'"').join(',')).join('\\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv'}));a.download='eagle-collections-report.csv';a.click()}
function staffPage(c){c.innerHTML=head('Staff accounts','Create accounts and assign a role.')+`<div class="card"><h2 class="sectiontitle">Create staff account</h2><div class="formgrid"><div><label>Full name</label><input id="sname"></div><div><label>Email</label><input id="semail"></div><div><label>Temporary password</label><input id="spass" type="password"></div><div><label>Role</label><select id="srole"><option>Billing User</option><option>Super Admin</option></select></div></div><button style="margin-top:12px" onclick="addStaff()">Create account</button></div><div class="card" style="margin-top:15px"><h2 class="sectiontitle">Team members</h2><table><thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Status</th></tr></thead><tbody>${staff.map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(s.email)}</td><td>${s.role}</td><td>${s.active?'Active':'Inactive'}</td></tr>`).join('')}</tbody></table></div>`}
function addStaff(){let name=document.getElementById('sname').value,email=document.getElementById('semail').value,role=document.getElementById('srole').value;if(!name||!email){alert('Enter name and email.');return}staff.push({name,email,role,active:true});saveAll();go('Staff Accounts');alert('Staff profile added. This browser-only demo does not create secure server login accounts.')}
function rolesPage(c){c.innerHTML=head('Roles & permissions','Control what each staff role can access.')+`<div class="card"><table><thead><tr><th>Role</th><th>Access</th><th>Users</th></tr></thead><tbody><tr><td>Super Admin</td><td>All modules and settings</td><td>${staff.filter(s=>s.role==='Super Admin').length}</td></tr><tr><td>Billing User</td><td>Overview, POS, Invoices, Inventory, Customers, Reports</td><td>${staff.filter(s=>s.role==='Billing User').length}</td></tr></tbody></table><div class="notice">Role access is enforced in this demo's navigation. For production, permissions must also be enforced by a secure server and database.</div></div>`}
document.getElementById('today').textContent=new Date().toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});
</script></body></html>
